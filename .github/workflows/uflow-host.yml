name: UFlow host contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read fixed UFlow revision
        id: uflow
        run: |
          python -c 'import json,os; p=json.load(open("dependencies/uflow-sdk.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("ref="+p["commit"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: sjduan/UFlow
          ref: ${{ steps.uflow.outputs.ref }}
          path: uflow-checkout
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pyyaml -r pypto_serving/requirements-runtime.txt
          python -m pip install --no-deps ./uflow-checkout/sdk/python
      - name: Run host contracts and lifecycle checks
        run: |
          python -m pytest -q --junitxml="$RUNNER_TEMP/uflow-host.xml" \
            tests/unit/serving/test_managed_pool_*.py \
            tests/unit/serving/test_existing_pool.py \
            tests/unit/serving/test_shared_partition.py \
            tests/unit/serving/test_shared_prefix_directory.py \
            tests/unit/serving/test_shared_exchange*.py \
            tests/unit/serving/test_shared_prefix_record.py \
            tests/unit/serving/test_cooperative_close.py \
            tests/unit/serving/test_terminal_unmap.py \
            tests/unit/test_task_supervisor.py tests/unit/test_task_lifecycle.py \
            tests/unit/test_locked_lib.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uflow-host-contracts
          path: ${{ runner.temp }}/uflow-host.xml
